<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>浏览器指纹 · Fingerprint Lab</title><style>
:root{color-scheme:dark;--bg:#0b1019;--card:#121b28;--line:#253247;--muted:#93a4bc;--accent:#66e1bc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#123236 0,transparent 45%),var(--bg);color:#edf3fc;font:15px/1.6 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:36px 24px}header,.toolbar,.summary{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{font-weight:750;letter-spacing:2px}.badge{font-size:12px;border:1px solid #356452;color:var(--accent);padding:5px 12px;border-radius:30px}h1{font-size:clamp(30px,5vw,48px);margin:40px 0 6px;letter-spacing:-1px}p{color:var(--muted);margin:0 0 24px}.toolbar{justify-content:flex-start;margin:24px 0}button{background:#1e3041;color:#edf3fc;border:1px solid #35495e;border-radius:9px;padding:10px 18px;font:inherit;cursor:pointer}button:first-child{background:var(--accent);color:#09291f;border-color:var(--accent);font-weight:700}button:hover{filter:brightness(1.13)}button:disabled{opacity:.5;cursor:wait}button:focus-visible{outline:3px solid #fff;outline-offset:3px}.summary{background:linear-gradient(110deg,#173c36,#152336);border:1px solid #31534e;border-radius:14px;padding:24px;margin:25px 0}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}#fingerprint{font:16px/1.8 ui-monospace,monospace;word-break:break-all;color:var(--accent)}#count{font-size:32px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}h2{font-size:16px;margin:0 0 15px}dl{margin:0}.row{display:grid;grid-template-columns:145px 1fr;gap:14px;padding:10px 0;border-top:1px solid #223044}dt{color:var(--muted);font-size:13px}dd{margin:0;overflow-wrap:anywhere;font:13px/1.7 ui-monospace,monospace}footer{color:var(--muted);font-size:12px;margin-top:25px}#status{font-size:13px;color:var(--accent)}@media(max-width:720px){.grid{grid-template-columns:1fr}.row{grid-template-columns:115px 1fr}main{padding:24px 16px}.summary{padding:18px}}
</style></head><body><main><header><div class="brand">◉ FINGERPRINT LAB</div><div class="badge">● 本地检测 · 零上传</div></header><h1>看见你的浏览器指纹</h1><p>探索当前浏览器暴露的环境特征。无需登录，不请求摄像头、麦克风或位置权限。</p><div class="toolbar"><button id="refresh">重新检测</button><button id="copy">复制 JSON</button><button id="export">导出报告 ↓</button><span id="status" role="status" aria-live="polite">等待检测</span></div><section class="summary"><div style="min-width:0;flex:1"><div class="label">环境摘要 · SHA-256</div><div id="fingerprint">正在计算…</div></div><div><div id="count">—</div><div class="label">检测字段</div></div></section><div id="cards" class="grid"></div><footer>说明：摘要不代表永久身份或全球唯一标识；浏览器更新、隐私保护及环境变化均可能改变结果。部分字段可能被浏览器隐藏或标准化。页面不检测公网 IP，不加载第三方资源。</footer></main><script src="app.js"></script></body></html>
