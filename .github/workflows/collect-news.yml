name: Collect news and deploy Pages

# 这个文件必须存在于 main 分支（main = 线上静态站，GitHub Pages 从这里发布）。
# 定时任务只在默认分支上生效，所以 main 上必须有它——本地 build.bat 用 robocopy /MIR
# 同步 dist 时要排除 .github/，否则会被删掉（2026-11-15 采集全停就是这个原因）。
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每 6 小时一次（UTC 0/6/12/18 点的第 17 分钟）。
    # 改频的直接原因是 Workers AI 免费额度：10,000 neurons/天，每小时三段生成会把额度打满，
    # 一打满就是整点 429，速览全挂。6 小时一次约消耗 1,300~1,800 neurons，只占额度两成。
    # GitHub 定时任务是尽力而为（实测 4~16 小时一次），真正维持节奏的是 Cloudflare Worker。
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-collect
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARGOS_PACKAGES_DIR: ${{ github.workspace }}/.argos-models
      ARGOS_DEVICE_TYPE: cpu
      ARGOS_INTRA_THREADS: "2"
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache offline English-Chinese model
        uses: actions/cache@v4
        with:
          path: ${{ env.ARGOS_PACKAGES_DIR }}
          key: argos-en-zh-1.9-v1
      - name: Prepare offline Argos translation
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          python -m pip install argostranslate==1.11.0
          python -c "from fetch_extra_hotspots import prepare_offline_translation, translate_title; prepare_offline_translation(); print(translate_title('Security news'))"
      - name: Restore previous headlines
        uses: actions/cache/restore@v4
        with:
          path: |
            news.json
            github-trending.json
            v2ex-hot.json
            weibo-hot.json
            xueqiu-hot.json
            hacker-news.json
            markets.json
            exchange-rates.json
            history-today.json
            nasa-apod.json
            x-hot.json
            x-global.json
            x-words.json
            x-articles.json
            collection-health.json
            source-covers/
          key: news-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-
      - name: Restore last published snapshots when cache is empty
        run: |
          for f in news.json github-trending.json v2ex-hot.json weibo-hot.json xueqiu-hot.json hacker-news.json markets.json exchange-rates.json history-today.json nasa-apod.json x-hot.json x-global.json x-words.json x-articles.json collection-health.json extra-hotspots.json; do
            if [ ! -s "$f" ]; then
              curl --fail --silent --show-error --max-time 20 "https://axaaaaa.github.io/$f" -o "$f" || rm -f "$f"
            fi
          done
      - name: Restore extra headlines for this collector version
        uses: actions/cache/restore@v4
        with:
          path: extra-hotspots.json
          key: extra-hotspots-${{ hashFiles('fetch_extra_hotspots.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: extra-hotspots-${{ hashFiles('fetch_extra_hotspots.py') }}-
      - name: Install Playwright for FreeBuf scraping
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      # 采集脚本的单元测试：失败只告警不拦截，避免一个不稳定的测试把整条采集链卡死
      - name: Test collectors (non-blocking)
        continue-on-error: true
        run: python -m unittest discover -s scripts -p "test_*.py"
      # 采集会把 news.json 覆写成裸数据（只剩 updatedAt + items），digest 字段一起没了。
      # 这里在采集前留一份带 digest 的副本，AI 生成失败时用它兜底，速览才不会凭空消失。
      - name: Backup previous digest
        run: |
          cp news.json news.previous.json || true
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          def digest_of(raw):
              try:
                  return json.loads(raw.decode('utf-8-sig') if isinstance(raw, bytes) else raw).get('digest')
              except Exception:
                  return None

          def stamp(digest):
              return (digest or {}).get('generatedAt') or ''

          prev = Path('news.previous.json')
          best = prev.read_bytes() if prev.exists() else b''
          if not digest_of(best):
              best = b''
          try:
              head = subprocess.run(['git', 'show', 'HEAD:news.json'], capture_output=True, check=True).stdout
          except Exception:
              head = b''
          head_digest = digest_of(head)
          if head_digest and stamp(head_digest) > stamp(digest_of(best)):
              best = head
          chosen = digest_of(best)
          if chosen:
              prev.write_bytes(best)
              print(f"DIGEST_BACKUP 选用 {stamp(chosen)} 这一版（工作区与仓库里取较新的）")
          else:
              print('DIGEST_BACKUP 没有可用的速览副本')
          PY
      - name: Refresh independent sources and record health
        timeout-minutes: 30
        run: xvfb-run -a python scripts/refresh_sources.py
      - name: Refresh NASA Astronomy Picture of the Day
        continue-on-error: true
        run: python fetch_nasa_apod.py --output nasa-apod.json
      # AI 速览：调用 Cloudflare Workers AI 把头条压成三句话写回 news.json。
      # 失败只跳过，不影响采集与部署；未配置 secrets 时会打印 DIGEST_SKIP。
      - name: Generate AI digest
        continue-on-error: true
        run: python generate_digest.py --input news.json
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Save headlines
        uses: actions/cache/save@v4
        with:
          path: |
            news.json
            github-trending.json
            v2ex-hot.json
            weibo-hot.json
            xueqiu-hot.json
            hacker-news.json
            markets.json
            exchange-rates.json
            history-today.json
            nasa-apod.json
            x-hot.json
            x-global.json
            x-words.json
            x-articles.json
            collection-health.json
            source-covers/
          key: news-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save extra headlines for this collector version
        uses: actions/cache/save@v4
        with:
          path: extra-hotspots.json
          key: extra-hotspots-${{ hashFiles('fetch_extra_hotspots.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      # 站点本体由本地 build.bat 构建后推到 main，这里只把采集结果拼进静态资产再发布，不跑 npm build
      - name: Package existing static website
        run: |
          mkdir -p _site
          for f in index.html favicon.ico news.json github-trending.json \
                   v2ex-hot.json weibo-hot.json xueqiu-hot.json hacker-news.json markets.json \
                   exchange-rates.json extra-hotspots.json history-today.json nasa-apod.json \
                   bank-rates.json \
                   x-global.json x-hot.json x-words.json x-articles.json collection-health.json og-image.jpg; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          cp -R css img js _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          for dir in country-flags engine-icons fingerprint-lab source-icons brand-logos maps bank-logos coin-logos; do
            if [ -d "$dir" ]; then cp -R "$dir" _site/; fi
          done
          touch _site/.nojekyll
          python - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path
          site = Path('_site')
          # Copy covers referenced by published snapshots only. Leave the collector cache intact.
          covers = set()
          for snapshot in site.glob('*.json'):
              try:
                  pending = [json.loads(snapshot.read_text(encoding='utf-8-sig'))]
              except (ValueError, OSError) as error:
                  print(f'PAGES_SNAPSHOT_UNREADABLE {snapshot.name}: {error}')
                  continue
              while pending:
                  item = pending.pop()
                  if isinstance(item, dict):
                      pending.extend(item.values())
                  elif isinstance(item, list):
                      pending.extend(item)
                  elif isinstance(item, str) and re.fullmatch(r'source-covers/[a-z0-9_\-]+/[a-f0-9]{24}\.(?:jpg|png|webp|gif)', item):
                      covers.add(item)
          copied = cover_bytes = 0
          for name in sorted(covers):
              source = Path(name)
              if not source.is_file():
                  continue
              target = site / source
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              copied += 1
              cover_bytes += target.stat().st_size
          print(f'PAGES_COVERS copied={copied} referenced={len(covers)} bytes={cover_bytes}')
          size = sum(p.stat().st_size for p in site.rglob('*') if p.is_file())
          total = size
          while True:
              manifest = json.dumps({'deployedBytes': total}, separators=(',', ':')) + '\n'
              if total == size + len(manifest):
                  break
              total = size + len(manifest)
          (site / 'pages-usage.json').write_bytes(manifest.encode('utf-8'))
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
