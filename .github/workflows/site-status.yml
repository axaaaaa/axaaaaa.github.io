name: Website status and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *' # retry opportunity twice hourly; GitHub scheduling is best-effort
permissions:
  contents: read
concurrency:
  group: pages-status
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore previous headlines
        uses: actions/cache/restore@v4
        with:
          path: |
            news.json
            github-trending.json
            v2ex-hot.json
            weibo-hot.json
            hacker-news.json
            markets.json
            exchange-rates.json
            history-today.json
            nasa-apod.json
            x-hot.json
            x-global.json
            x-words.json
            x-articles.json
            collection-health.json
            source-covers/
          key: news-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-
      - name: Restore extra headlines for this collector version
        uses: actions/cache/restore@v4
        with:
          path: extra-hotspots.json
          key: extra-hotspots-${{ hashFiles('fetch_extra_hotspots.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: extra-hotspots-${{ hashFiles('fetch_extra_hotspots.py') }}-
      - name: Install Playwright for FreeBuf scraping
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Test collectors
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Refresh independent sources and record health
        env:
          GOOGLE_TRANSLATION_STATE: ${{ runner.temp }}/google-translation-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: xvfb-run -a python scripts/refresh_sources.py
      - name: Refresh NASA Astronomy Picture of the Day
        env:
          GOOGLE_TRANSLATION_STATE: ${{ runner.temp }}/google-translation-${{ github.run_id }}-${{ github.run_attempt }}.json
        continue-on-error: true
        run: python fetch_nasa_apod.py --output nasa-apod.json
      - name: Save headlines
        uses: actions/cache/save@v4
        with:
          path: |
            news.json
            github-trending.json
            v2ex-hot.json
            weibo-hot.json
            hacker-news.json
            markets.json
            exchange-rates.json
            history-today.json
            nasa-apod.json
            x-hot.json
            x-global.json
            x-words.json
            x-articles.json
            collection-health.json
            source-covers/
          key: news-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save extra headlines for this collector version
        uses: actions/cache/save@v4
        with:
          path: extra-hotspots.json
          key: extra-hotspots-${{ hashFiles('fetch_extra_hotspots.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore previous status
        uses: actions/cache/restore@v4
        with:
          path: .status-cache/status.json
          key: site-status-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: site-status-
      - name: Test checker
        run: python -m unittest discover -s scripts -p test_check_sites.py
      - name: Check public websites
        run: python scripts/check_sites.py
      - name: Save status history
        uses: actions/cache/save@v4
        with:
          path: .status-cache/status.json
          key: site-status-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package existing static website
        run: |
          mkdir -p _site
          for f in index.html favicon.ico status.json news.json github-trending.json \
                   v2ex-hot.json weibo-hot.json hacker-news.json markets.json \
                   exchange-rates.json extra-hotspots.json history-today.json nasa-apod.json \
                   x-global.json x-hot.json x-words.json x-articles.json collection-health.json og-image.jpg; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          cp -R css img js _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          for dir in country-flags engine-icons fingerprint-lab source-covers source-icons; do
            if [ -d "$dir" ]; then cp -R "$dir" _site/; fi
          done
          touch _site/.nojekyll
          python - <<'PY'
          import json
          from pathlib import Path
          site = Path('_site')
          size = sum(p.stat().st_size for p in site.rglob('*') if p.is_file())
          total = size
          while True:
              manifest = json.dumps({'deployedBytes': total}, separators=(',', ':')) + '\n'
              if total == size + len(manifest):
                  break
              total = size + len(manifest)
          (site / 'pages-usage.json').write_bytes(manifest.encode('utf-8'))
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
