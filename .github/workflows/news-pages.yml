name: News and GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: pages-news
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: |
            public/news.json
            public/github-trending.json
            public/v2ex-hot.json
            public/hacker-news.json
            public/weibo-hot.json
          key: news-source-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-source-
      - run: python -m unittest discover -s scripts -p test_news.py
      - run: python -m unittest discover -s scripts -p test_github_trending.py
      - run: python -m unittest discover -s scripts -p test_v2ex.py
      - run: python -m unittest discover -s scripts -p test_hacker_news.py
      - run: python -m unittest discover -s scripts -p test_weibo.py
      - run: python scripts/fetch_news.py
      - run: python scripts/fetch_github_trending.py
      - run: python scripts/fetch_v2ex.py
      - run: python scripts/fetch_hacker_news.py
      - run: python scripts/fetch_weibo.py
      - uses: actions/cache/save@v4
        with:
          path: |
            public/news.json
            public/github-trending.json
            public/v2ex-hot.json
            public/hacker-news.json
            public/weibo-hot.json
          key: news-source-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm ci
      - run: npm run build:deploy
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

