name: Website status and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *' # retry opportunity twice hourly; GitHub scheduling is best-effort
permissions:
  contents: read
concurrency:
  group: pages-status
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARGOS_PACKAGES_DIR: ${{ github.workspace }}/.argos-models
      ARGOS_DEVICE_TYPE: cpu
      ARGOS_INTRA_THREADS: "2"
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache offline English-Chinese model
        uses: actions/cache@v4
        with:
          path: ${{ env.ARGOS_PACKAGES_DIR }}
          key: argos-en-zh-1.9-v1
      - name: Prepare offline Argos translation
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          python -m pip install argostranslate==1.11.0
          python -c "from fetch_extra_hotspots import prepare_offline_translation, translate_title; prepare_offline_translation(); print(translate_title('Security news'))"
      - name: Restore previous headlines
        uses: actions/cache/restore@v4
        with:
          path: |
            news.json
            github-trending.json
            v2ex-hot.json
            weibo-hot.json
            hacker-news.json
            markets.json
            exchange-rates.json
            history-today.json
            nasa-apod.json
            x-hot.json
            x-global.json
            x-words.json
            x-articles.json
            collection-health.json
            source-covers/
          key: news-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-
      - name: Restore extra headlines for this collector version
        uses: actions/cache/restore@v4
        with:
          path: extra-hotspots.json
          key: extra-hotspots-${{ hashFiles('fetch_extra_hotspots.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: extra-hotspots-${{ hashFiles('fetch_extra_hotspots.py') }}-
      - name: Install Playwright for FreeBuf scraping
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Test collectors
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Refresh independent sources and record health
        run: xvfb-run -a python scripts/refresh_sources.py
      - name: Refresh NASA Astronomy Picture of the Day
        continue-on-error: true
        run: python fetch_nasa_apod.py --output nasa-apod.json
      - name: Save headlines
        uses: actions/cache/save@v4
        with:
          path: |
            news.json
            github-trending.json
            v2ex-hot.json
            weibo-hot.json
            hacker-news.json
            markets.json
            exchange-rates.json
            history-today.json
            nasa-apod.json
            x-hot.json
            x-global.json
            x-words.json
            x-articles.json
            collection-health.json
            source-covers/
          key: news-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save extra headlines for this collector version
        uses: actions/cache/save@v4
        with:
          path: extra-hotspots.json
          key: extra-hotspots-${{ hashFiles('fetch_extra_hotspots.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore previous status
        uses: actions/cache/restore@v4
        with:
          path: .status-cache/status.json
          key: site-status-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: site-status-
      - name: Test checker
        run: python -m unittest discover -s scripts -p test_check_sites.py
      - name: Check public websites
        run: python scripts/check_sites.py
      - name: Save status history
        uses: actions/cache/save@v4
        with:
          path: .status-cache/status.json
          key: site-status-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package existing static website
        run: |
          mkdir -p _site
          for f in index.html favicon.ico status.json news.json github-trending.json \
                   v2ex-hot.json weibo-hot.json hacker-news.json markets.json \
                   exchange-rates.json extra-hotspots.json history-today.json nasa-apod.json \
                   x-global.json x-hot.json x-words.json x-articles.json collection-health.json og-image.jpg; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          cp -R css img js _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          for dir in country-flags engine-icons fingerprint-lab source-icons; do
            if [ -d "$dir" ]; then cp -R "$dir" _site/; fi
          done
          touch _site/.nojekyll
          python - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path
          site = Path('_site')
          # Copy covers referenced by published snapshots only. Leave the collector cache intact.
          covers = set()
          for snapshot in site.glob('*.json'):
              try:
                  pending = [json.loads(snapshot.read_text(encoding='utf-8-sig'))]
              except (ValueError, OSError) as error:
                  print(f'PAGES_SNAPSHOT_UNREADABLE {snapshot.name}: {error}')
                  continue
              while pending:
                  item = pending.pop()
                  if isinstance(item, dict):
                      pending.extend(item.values())
                  elif isinstance(item, list):
                      pending.extend(item)
                  elif isinstance(item, str) and re.fullmatch(r'source-covers/[a-z0-9_\-]+/[a-f0-9]{24}\.(?:jpg|png|webp|gif)', item):
                      covers.add(item)
          copied = cover_bytes = 0
          for name in sorted(covers):
              source = Path(name)
              if not source.is_file():
                  continue
              target = site / source
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              copied += 1
              cover_bytes += target.stat().st_size
          print(f'PAGES_COVERS copied={copied} referenced={len(covers)} bytes={cover_bytes}')
          size = sum(p.stat().st_size for p in site.rglob('*') if p.is_file())
          total = size
          while True:
              manifest = json.dumps({'deployedBytes': total}, separators=(',', ':')) + '\n'
              if total == size + len(manifest):
                  break
              total = size + len(manifest)
          (site / 'pages-usage.json').write_bytes(manifest.encode('utf-8'))
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
